# Regenerates index.json after every push that touches an update or release
# note. caspiantools.com reads it at build time. Its deploy-site workflow polls
# this file hourly and rebuilds when it changed since the last deploy, so a new
# update reaches the project pages and the RSS / JSON feeds within about an
# hour. There is deliberately no cross-repo trigger: nothing here holds a token
# for caspiantools.
#
# The commit this job makes uses GITHUB_TOKEN, and GitHub never starts a new
# workflow run from a GITHUB_TOKEN push, so the job cannot loop on itself.

name: Build index

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - scripts/build-index.mjs
      - .github/workflows/index.yml
  workflow_dispatch:

concurrency:
  group: build-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build index.json
        run: node scripts/build-index.mjs

      - name: Commit index.json if it changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push

